<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>README Preview · Threetwoa Digital Garden</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --paper: #fffefb;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e7e2d8;
      --accent: #5f7a66;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(143, 175, 150, 0.12), transparent 40%),
        var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: rgba(255, 254, 251, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .topbar strong { color: var(--accent); letter-spacing: 0.02em; }
    .topbar span { color: var(--muted); font-size: 0.9rem; }
    .shell {
      max-width: 980px;
      margin: 1.5rem auto 3rem;
      padding: 0 1rem;
    }
    .paper {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 2rem 2.25rem 3rem;
      box-shadow: 0 18px 50px rgba(47, 52, 55, 0.06);
    }
    #content :is(h1, h2, h3) {
      line-height: 1.25;
      scroll-margin-top: 4rem;
    }
    #content h1 {
      font-size: 2rem;
      margin: 0 0 0.75rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.6rem;
    }
    #content h2 {
      font-size: 1.45rem;
      margin: 2.2rem 0 0.9rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--line);
    }
    #content h3 {
      font-size: 1.1rem;
      margin: 1.4rem 0 0.6rem;
    }
    #content blockquote {
      margin: 1rem 0;
      padding: 0.15rem 0 0.15rem 1rem;
      border-left: 3px solid #c99b9b;
      color: var(--muted);
    }
    #content p { margin: 0.75rem 0; }
    #content ul, #content ol { padding-left: 1.35rem; }
    #content li { margin: 0.25rem 0; }
    #content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.95rem;
    }
    #content th, #content td {
      border: 1px solid var(--line);
      padding: 0.55rem 0.7rem;
      vertical-align: top;
    }
    #content th { background: #f7f4ee; text-align: left; }
    /* Content diagrams / showcase: block & full width */
    #content img[src*="assets/images/readme/"] {
      /* Prefer HTML width attrs (85%); cap at container */
      max-width: 100%;
      width: auto;
      height: auto;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      display: block;
      margin: 1rem auto;
    }
    /* Shields / badges: keep horizontal inline layout */
    #content img[src*="img.shields.io"],
    #content img[src*="shields.io"] {
      display: inline-block;
      width: auto;
      max-width: none;
      height: 28px;
      margin: 0.2rem 0.25rem;
      border: 0;
      border-radius: 4px;
      vertical-align: middle;
      background: transparent;
    }
    #content p {
      text-align: inherit;
    }
    #content p[align="center"],
    #content div[align="center"] {
      text-align: center;
    }
    #content p[align="center"] img[src*="assets/images/readme/"] {
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    #content pre {
      overflow: auto;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem 1.1rem;
      border-radius: 12px;
      font-size: 0.88rem;
    }
    #content code {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.9em;
    }
    #content :not(pre) > code {
      background: #f1efe8;
      padding: 0.1em 0.35em;
      border-radius: 5px;
    }
    #content hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 1.5rem 0;
    }
    #content a { color: #3f6f8f; }
    .status {
      margin: 1rem 0 0;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      font-size: 0.92rem;
    }
    .status.error {
      background: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }
    .asset-check {
      margin-top: 1rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .asset-check code { color: var(--ink); }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <strong>README Preview</strong>
      <span> · Threetwoa Digital Garden · local static view</span>
    </div>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <label style="font-size:0.9rem;color:var(--muted);">
        文档
        <select id="doc-select" style="margin-left:0.35rem;padding:0.25rem 0.45rem;border:1px solid var(--line);border-radius:6px;background:#fff;">
          <option value="README.md" selected>中文 README.md</option>
          <option value="README.en.md">English README.en.md</option>
        </select>
      </label>
      <span id="meta">loading…</span>
    </div>
  </div>

  <div class="shell">
    <div id="banner-status" class="status" style="display:none"></div>
    <div class="paper">
      <div id="content">Loading README.md…</div>
    </div>
    <div id="asset-check" class="asset-check"></div>
  </div>

  <script>
    const assets = [
      "assets/images/readme/banner.png",
      "assets/images/readme/features.png",
      "assets/images/readme/architecture.png",
      "assets/images/readme/tech-stack.png",
      "assets/images/readme/workflow.png",
      "assets/images/readme/structure.png",
      "assets/images/readme/showcase-home.png",
      "assets/images/readme/showcase-writing.png",
      "assets/images/readme/showcase-article-detail.png",
      "assets/images/readme/showcase-gallery.png",
      "assets/images/readme/showcase-about.png",
    ];

    async function checkAssets() {
      const results = await Promise.all(assets.map(async (src) => {
        try {
          const res = await fetch(src, { method: "HEAD" });
          return { src, ok: res.ok };
        } catch {
          return { src, ok: false };
        }
      }));
      const bad = results.filter((r) => !r.ok);
      const el = document.getElementById("asset-check");
      const status = document.getElementById("banner-status");
      if (bad.length === 0) {
        status.style.display = "block";
        status.className = "status";
        status.textContent = `All ${results.length} README assets loaded successfully.`;
        el.innerHTML = results.map((r) => `✅ <code>${r.src}</code>`).join("<br>");
      } else {
        status.style.display = "block";
        status.className = "status error";
        status.textContent = `${bad.length} asset(s) failed to load.`;
        el.innerHTML = results.map((r) => `${r.ok ? "✅" : "❌"} <code>${r.src}</code>`).join("<br>");
      }
      return bad.length === 0;
    }

    async function loadDoc(name) {
      const meta = document.getElementById("meta");
      try {
        const res = await fetch(name, { cache: "no-store" });
        if (!res.ok) throw new Error(`${name} HTTP ${res.status}`);
        const md = await res.text();
        // marked preserves raw HTML in README (img tags, badges)
        document.getElementById("content").innerHTML = marked.parse(md, {
          gfm: true,
          breaks: false,
        });
        meta.textContent = `${name} · ${(md.length / 1024).toFixed(1)} KB · ${new Date().toLocaleTimeString()}`;
        await checkAssets();
      } catch (err) {
        document.getElementById("content").innerHTML =
          `<p style="color:#991b1b">Failed to load ${name}. Serve from project root (e.g. <code>npx serve . -l 3456</code>).</p><pre>${String(err)}</pre>`;
        meta.textContent = "error";
      }
    }

    document.getElementById("doc-select").addEventListener("change", (e) => {
      loadDoc(e.target.value);
    });

    loadDoc("README.md");
  </script>
</body>
</html>
